<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PhotoFrame 修正確定版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #000; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
  
  /* 設定画面 */
  #setup { position: fixed; inset: 0; background: #0c0c0c; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; z-index: 100; color: #fff; }
  .btn { background: #fff; color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 80%; max-width: 300px; text-align: center; }
  .album-input { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; margin-top: 10px; width: 80%; max-width: 300px; text-align: center; font-size: 16px; }
  #status { margin-top: 15px; color: #888; font-size: 14px; }

  /* スライドショー画面 */
  #ss { position: fixed; inset: 0; background: #000; display: none; }
  .slide-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 1s ease-in-out; opacity: 0; }
  #clock { position: absolute; top: 30px; right: 40px; font-size: 32px; color: rgba(255,255,255,0.85); font-weight: 300; text-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 10; }
  #album-label { position: absolute; bottom: 30px; left: 40px; color: rgba(255,255,255,0.9); font-size: 20px; font-weight: 400; text-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 10; }
</style>
</head>
<body>

<div id="setup">
  <h2 style="font-weight:300; letter-spacing:0.1em; margin-bottom:10px;">フォトフレーム</h2>
  <p style="color:#666; font-size:14px; margin-bottom:20px;">写真を全選択して読み込んでください</p>
  
  <input type="file" id="file-input" multiple accept="image/jpeg, image/jpg, image/png" style="display:none;">
  <button class="btn" onclick="document.getElementById('file-input').click()">写真を選択する</button>
  
  <div id="status">選択されていません</div>
  
  <div id="album-zone" style="display:none; width:100%; text-align:center; margin-top:10px;">
    <p style="font-size:14px; color:#aaa;">アルバム名を入力：</p>
    <input type="text" id="album-name" class="album-input" value="未分類">
  </div>
  
  <button id="start-btn" class="btn" style="display:none; background:#00E676; color:#000;" onclick="startSlideshow()">スライドショーを開始</button>
</div>

<div id="ss">
  <img id="img1" class="slide-img">
  <img id="img2" class="slide-img">
  <div id="clock">00:00</div>
  <div id="album-label"></div>
</div>

<script>
let photoList = [];
let currentIndex = 0;
let slideInterval = null;

// 写真が選ばれた時の処理
document.getElementById('file-input').addEventListener('change', function(e) {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;

  // 読み込んだ写真をリストに格納
  files.forEach(file => {
    const blobUrl = URL.createObjectURL(file);
    photoList.push({
      url: blobUrl,
      name: file.name
    });
  });

  document.getElementById('status').textContent = photoList.length + "枚 の写真を読み込みました";
  document.getElementById('album-zone').style.display = "block";
  document.getElementById('start-btn').style.display = "inline-block";
});

// スライドショー開始ボタンが押された時
function startSlideshow() {
  if (photoList.length === 0) return;

  // 入力されたアルバム名を取得
  const finalAlbumName = document.getElementById('album-name').value || "未分類";
  
  // すべての写真にアルバム名を紐付ける
  photoList.forEach(p => {
    p.album = finalAlbumName;
  });

  // シャッフル（ランダム並び替え）
  for (let i = photoList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [photoList[i], photoList[j]] = [photoList[j], photoList[i]];
  }

  // 画面の切り替え
  document.getElementById('setup').style.display = "none";
  document.getElementById('ss').style.display = "block";

  // 時計スタート
  updateClock();
  setInterval(updateClock, 1000);

  // 最初の一枚を表示
  runSlide();
  // 10秒ごとに切り替え
  slideInterval = setInterval(runSlide, 10000);
}

// 写真を切り替えるメイン処理
function runSlide() {
  const currentPhoto = photoList[currentIndex];
  const img1 = document.getElementById('img1');
  const img2 = document.getElementById('img2');
  const label = document.getElementById('album-label');

  // 表示中と非表示中の画像を入れ替える（クロスフェード）
  let activeImg = (img1.style.opacity === "1") ? img2 : img1;
  let inactiveImg = (img1.style.opacity === "1") ? img1 : img2;

  activeImg.src = currentPhoto.url;
  activeImg.style.opacity = "1";
  inactiveImg.style.opacity = "0";
  
  // アルバム名を表示
  label.textContent = currentPhoto.album;

  // 次のインデックスへ
  currentIndex = (currentIndex + 1) % photoList.length;
}

// 時計の更新
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ":" + m;
}
</script>
</body>
</html>
